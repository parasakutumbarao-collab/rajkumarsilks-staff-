<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahanvi Retail OS</title>
<style>
:root{
 --bg:#f3f5f7;--card:#fff;--primary:#0f766e;
 --border:#e5e7eb;--text:#1f2937;
}
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:var(--bg);color:var(--text)}
.header{background:var(--primary);color:#fff;padding:18px;text-align:center;font-size:22px;font-weight:bold}
.wrap{padding:16px;max-width:900px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:#fff;padding:14px;border-radius:12px;margin-top:14px}
.metric{font-size:28px;font-weight:bold;color:var(--primary)}
label{display:block;margin-top:10px;font-weight:bold}
select,button{width:100%;padding:11px;margin-top:6px;border-radius:8px}
.row{display:flex;gap:10px;margin-top:15px}
.bill{background:#16a34a;color:#fff;border:none}
.no{background:#ea580c;color:#fff;border:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:center}
th{background:#f8fafc}
</style>
</head>
<body>

<div class="header">
SAHANVI RETAIL OS
<div style="font-size:13px">Version 1.1 | Manager PIN 2580</div>
</div>

<div class="wrap">

<div class="grid">
<div class="card"><div>Customers</div><div id="customers" class="metric">0</div></div>
<div class="card"><div>Bills</div><div id="bills" class="metric">0</div></div>
<div class="card"><div>Conv%</div><div id="conv" class="metric">0%</div></div>
</div>

<div class="card">
<h3>Staff Entry</h3>

<label>First Staff</label>
<select id="first">
<option>100</option><option>200</option><option>300</option>
<option>400</option><option>500</option><option>600</option>
<option>700</option><option>800</option><option>900</option>
<option>1000</option>
</select>

<label>Second Staff</label>
<select id="second">
<option value="">None</option>
<option>100</option><option>200</option><option>300</option>
<option>400</option><option>500</option><option>600</option>
<option>700</option><option>800</option><option>900</option>
<option>1000</option>
</select>

<label>No Sale Reason</label>
<select id="reason">
<option>Price</option>
<option>Design</option>
<option>Size</option>
<option>Compare</option>
</select>

<div class="row">
<button class="bill" onclick="bill()">BILL</button>
<button class="no" onclick="nosale()">NO SALE</button>
</div>

</div>

<div class="card">
<h3>Today's KPI</h3>
<table>
<thead>
<tr><th>Staff</th><th>Customers</th><th>Bills</th><th>%</th></tr>
</thead>
<tbody id="kpi"></tbody>
</table>
</div>

<div class="card">
<h3>Showing → Closing Journey</h3>
<table>
<thead>
<tr><th>1st</th><th>2nd</th><th>Result</th></tr>
</thead>
<tbody id="journey"></tbody>
</table>
</div>

<div class="card">
<button onclick="manager()">Manager Dashboard (PIN)</button>
</div>

</div>

<script>
let db=JSON.parse(localStorage.getItem("sahanvi_v11")||"null");

if(!db){
 db={staff:{},logs:[]};
 [100,200,300,400,500,600,700,800,900,1000].forEach(id=>{
   db.staff[id]={c:0,b:0};
 });
 save();
}

function save(){
 localStorage.setItem("sahanvi_v11",JSON.stringify(db));
}

function render(){
 let tc=0,tb=0;
 let body="";
 Object.keys(db.staff).forEach(id=>{
   let s=db.staff[id];
   tc+=s.c; tb+=s.b;
   let per=s.c?Math.round(s.b/s.c*100):0;
   body+=`<tr>
   <td>${id}</td>
   <td>${s.c}</td>
   <td>${s.b}</td>
   <td>${per}%</td>
   </tr>`;
 });
 document.getElementById("kpi").innerHTML=body;
 document.getElementById("customers").innerText=tc;
 document.getElementById("bills").innerText=tb;
 document.getElementById("conv").innerText=tc?Math.round(tb/tc*100)+"%":"0%";

 let j="";
 db.logs.slice().reverse().forEach(x=>{
   j+=`<tr>
   <td>${x.first}</td>
   <td>${x.second||"-"}</td>
   <td>${x.result}</td>
   </tr>`;
 });
 document.getElementById("journey").innerHTML=j;
}

function bill(){
 let f=first.value;
 let s=second.value;

 db.staff[f].c++;

 if(s==""){
   db.staff[f].b++;
 }else{
   db.staff[s].b++;
 }

 db.logs.push({
  first:f,
  second:s,
  result:"BILL"
 });

 save();
 render();
}

function nosale(){
 let f=first.value;
 let s=second.value;
 let r=reason.value;

 db.staff[f].c++;

 db.logs.push({
  first:f,
  second:s,
  result:"NO SALE",
  reason:r
 });

 save();
 render();
}

function manager(){
 let pin=prompt("Manager PIN");
 if(pin==="2580"){
   if(confirm("Reset Today Data?")){
     localStorage.removeItem("sahanvi_v11");
     location.reload();
   }
 }else if(pin!=null){
   alert("Wrong PIN");
 }
}

render();
</script>

</body>
</html>
