<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sahanvi Retail OS v1.3</title>
<style>
body{margin:0;font-family:Arial;background:#F5F7FA}
.header{background:#0F766E;color:#fff;padding:18px;text-align:center;font-size:22px;font-weight:bold}
.wrap{padding:15px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{font-size:28px;color:#0F766E;font-weight:bold}
select,button{width:100%;padding:11px;margin-top:8px;border-radius:8px}
.row{display:flex;gap:10px}
.bill{background:#16A34A;color:#fff;border:none}
.no{background:#EA580C;color:#fff;border:none}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:center}
</style>
</head>
<body>

<div class="header">
SAHANVI RETAIL OS
<div style="font-size:12px">Version 1.3</div>
</div>

<div class="wrap">

<div class="grid">
<div class="card"><div>Customers</div><div id="c" class="metric">0</div></div>
<div class="card"><div>Bills</div><div id="b" class="metric">0</div></div>
<div class="card"><div>Conv%</div><div id="cv" class="metric">0%</div></div>
</div>
<!-- STAFF ENTRY -->

<div class="card">
  <h3>👥 Staff Entry</h3>

  <label>First Staff</label>
  <select id="first">
    <option>100</option>
    <option>200</option>
    <option>300</option>
    <option>400</option>
    <option>500</option>
    <option>600</option>
    <option>700</option>
    <option>800</option>
    <option>900</option>
    <option>1000</option>
  </select>

  <label>Second Staff (Optional)</label>
  <select id="second">
    <option value="">None</option>
    <option>100</option>
    <option>200</option>
    <option>300</option>
    <option>400</option>
    <option>500</option>
    <option>600</option>
    <option>700</option>
    <option>800</option>
    <option>900</option>
    <option>1000</option>
  </select>

  <label>No Sale Reason</label>
  <select id="reason">
    <option>Price</option>
    <option>Design</option>
    <option>Size</option>
    <option>Compare</option>
  </select>

  <div class="row">
    <button class="bill" onclick="bill()">BILL</button>
    <button class="no" onclick="nosale()">NO SALE</button>
  </div>
</div>

<!-- KPI TABLE -->

<div class="card">
  <h3>📊 Today's KPI</h3>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Cust</th>
        <th>Bill</th>
        <th>%</th>
      </tr>
    </thead>

    <tbody id="kpiBody"></tbody>
  </table>
</div>

<!-- JOURNEY -->

<div class="card">
  <h3>🔄 Showing → Closing</h3>

  <table>
    <thead>
      <tr>
        <th>1st</th>
        <th>2nd</th>
        <th>Result</th>
      </tr>
    </thead>

    <tbody id="journey"></tbody>
  </table>
</div>

<!-- MANAGER -->

<div class="card">
  <button onclick="manager()">
    🔐 Manager Dashboard
  </button>
</div>
<script>
// ===== DATABASE =====
const STAFF_IDS = ["100","200","300","400","500","600","700","800","900","1000"];

let db = JSON.parse(localStorage.getItem("sahanvi_v13") || "null");

if (!db) {
  db = { staff:{}, names:{}, journey:[] };

  STAFF_IDS.forEach(id=>{
    db.staff[id]={customers:0,bills:0};
    db.names[id]="Staff "+id;
  });

  save();
}

function save(){
  localStorage.setItem("sahanvi_v13",JSON.stringify(db));
}

function render(){

  let tc=0,tb=0;
  let body="";

  STAFF_IDS.forEach(id=>{

    let s=db.staff[id];

    tc+=s.customers;
    tb+=s.bills;

    let per=s.customers?Math.round(s.bills/s.customers*100):0;

    body+=`
    <tr>
      <td>${id}</td>
      <td>${db.names[id]}</td>
      <td>${s.customers}</td>
      <td>${s.bills}</td>
      <td>${per}%</td>
    </tr>`;
  });

  kpiBody.innerHTML=body;

  customers.innerHTML=tc;
  bills.innerHTML=tb;
  conv.innerHTML=tc?Math.round(tb/tc*100)+"%":"0%";

  let j="";

  db.journey.slice().reverse().forEach(x=>{

    j+=`
    <tr>
      <td>${x.first}</td>
      <td>${x.second||"-"}</td>
      <td>${x.result}</td>
    </tr>`;

  });

  journey.innerHTML=j;

  save();

}

// ===== BILL =====
function bill(){

 let first=document.getElementById("first").value;
 let second=document.getElementById("second").value;

 db.staff[first].customers++;

 if(second===""){
    db.staff[first].bills++;
 }else{
    db.staff[second].bills++;
 }

 db.journey.push({
   first:first,
   second:second,
   result:"BILL"
 });

 render();

}

// ===== NO SALE =====
function nosale(){

 let first=document.getElementById("first").value;
 let second=document.getElementById("second").value;
 let rs=document.getElementById("reason").value;

 db.staff[first].customers++;

 db.journey.push({
   first:first,
   second:second,
   result:"NO SALE",
   reason:rs
 });

 render();

}

// ===== MANAGER =====
function manager(){

 let pin=prompt("Enter Manager PIN");

 if(pin!=="2580"){
   alert("Wrong PIN");
   return;
 }

 let opt=prompt(
`1 = Edit Staff Name
2 = Export CSV
3 = Reset Day`
 );

 if(opt==="1"){

    let id=prompt("Staff ID");

    if(!STAFF_IDS.includes(id)) return;

    let nm=prompt("New Name",db.names[id]);

    if(nm){
      db.names[id]=nm;
      render();
      alert("Updated");
    }

 }

 if(opt==="2"){
    exportCSV();
 }

 if(opt==="3"){

    if(confirm("Reset Today Data?")){

      STAFF_IDS.forEach(id=>{
        db.staff[id]={customers:0,bills:0};
      });

      db.journey=[];

      render();

      alert("Done");

    }

 }

}

// ===== CSV =====
function exportCSV(){

 let csv="ID,Name,Customers,Bills,Conversion\n";

 STAFF_IDS.forEach(id=>{

   let s=db.staff[id];

   let p=s.customers?Math.round(s.bills/s.customers*100):0;

   csv+=`${id},${db.names[id]},${s.customers},${s.bills},${p}%\n`;

 });

 const blob=new Blob([csv],{type:"text/csv"});

 const a=document.createElement("a");

 a.href=URL.createObjectURL(blob);

 a.download="Sahanvi_KPI.csv";

 a.click();

}

render();

</script>

</body>
</html>
