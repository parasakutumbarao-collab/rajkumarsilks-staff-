

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sahanvi Retail OS v6.1.1</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f7;margin:0}
header{background:#0f766e;color:#fff;padding:18px;text-align:center}
.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{font-size:28px;font-weight:bold;color:#0f766e}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:center}
button{padding:10px;border:0;border-radius:8px;color:#fff;cursor:pointer}
.bill{background:#16a34a}.nosale{background:#ea580c}
select{width:100%;padding:10px;margin:6px 0 12px}
</style>
</head>
<body>
<header>
<h2>SAHANVI RETAIL OS</h2>
<div>Version 6.1.1 • Firebase Realtime Sync</div>
</header>

<div class="wrap">
<div class="card grid">
<div><div>Customers</div><div id="customers" class="metric">0</div></div>
<div><div>Bills</div><div id="bills" class="metric">0</div></div>
<div><div>Conversion</div><div id="conv" class="metric">0%</div></div>
</div>

<div class="card">
<h3>Staff Entry</h3>
<select id="staff"><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option><option>600</option><option>700</option><option>800</option><option>900</option><option>1000</option></select>
<select id="showedBy"><option value="">No Second Staff</option><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option><option>600</option><option>700</option><option>800</option><option>900</option><option>1000</option></select>
<div style="display:flex;gap:10px">
<button class="bill" onclick="addBill()">Bill</button>
<button class="nosale" onclick="addNoSale()">No Sale</button>
</div>
</div>

<div class="card">
<h3>Showing → Closing Journey</h3>
<table>
<thead><tr><th>1st</th><th>2nd</th><th>Result</th></tr></thead>
<tbody id="journeyBody"></tbody>
</table>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,push,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app=initializeApp({
 apiKey:"AIzaSyAAe9XhHq4pFUHspxYICMxoDICPg2U4xPg",
 authDomain:"rajakumarsilksstaff.firebaseapp.com",
 databaseURL:"https://rajakumarsilksstaff-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"rajakumarsilksstaff",
 storageBucket:"rajakumarsilksstaff.firebasestorage.app",
 messagingSenderId:"191594189646",
 appId:"1:191594189646:web:c192d5c96549215be9041f"
});

const db=getDatabase(app);
const entries=ref(db,"entries");

window.addBill=()=>{
 push(entries,{
   first:staff.value,
   second:showedBy.value,
   result:"BILL",
   time:Date.now()
 });
};

window.addNoSale=()=>{
 push(entries,{
   first:staff.value,
   second:showedBy.value,
   result:"NO SALE",
   time:Date.now()
 });
};

onValue(entries,s=>{
 const rows=s.val()||{};
 const stat={},journey=[];
 let c=0,b=0;
 Object.values(rows).forEach(r=>{
   stat[r.first]=stat[r.first]||{c:0,b:0};
   stat[r.first].c++; c++;
   if(r.result==="BILL"){
     const id=(r.second&&r.second!==r.first)?r.second:r.first;
     stat[id]=stat[id]||{c:0,b:0};
     stat[id].b++; b++;
   }
   journey.push(r);
 });
 customers.textContent=c;
 bills.textContent=b;
 conv.textContent=c?Math.round(b/c*100)+"%":"0%";
 journeyBody.innerHTML="";
 journey.reverse().forEach(j=>{
   journeyBody.innerHTML+=`<tr><td>${j.first}</td><td>${j.second||"-"}</td><td>${j.result}</td></tr>`;
 });
});
</script>
</body>
</html>
